services:

  app:
    build: .
    container_name: e-assi-app-1
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg17
    container_name: e-assi-1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: e-assi-1
    ports:
      - "5433:5432"
    volumes:
      - e_assi_1_pgdata:/var/lib/postgresql/data

volumes:
  e_assi_1_pgdata: